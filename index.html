<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sportactiviteiten voor Ouders</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Sportactiviteiten</h1>
    <p>Kies een sport om de weekplanner te bekijken.</p>
  </header>

  <main class="sport-grid">
    <button class="sport-card" data-sport="voetbal" aria-label="Voetbal">
      <div class="sport-visual">⚽</div><h2>Voetbal</h2>
    </button>
    <button class="sport-card" data-sport="basketbal" aria-label="Basketbal">
      <div class="sport-visual">🏀</div><h2>Basketbal</h2>
    </button>
    <button class="sport-card" data-sport="gymnastiek" aria-label="Gymnastiek">
      <div class="sport-visual">🤸</div><h2>Gymnastiek</h2>
    </button>
    <button class="sport-card" data-sport="zwemmen" aria-label="Zwemmen">
      <div class="sport-visual">🏊</div><h2>Zwemmen</h2>
    </button>
    <button class="sport-card" data-sport="tennis" aria-label="Tennis">
      <div class="sport-visual">🎾</div><h2>Tennis</h2>
    </button>
    <button class="sport-card" data-sport="volleybal" aria-label="Volleybal">
      <div class="sport-visual">🏐</div><h2>Volleybal</h2>
    </button>
    <button class="sport-card" data-sport="hockey" aria-label="Hockey">
      <div class="sport-visual">🏑</div><h2>Hockey</h2>
    </button>
    <button class="sport-card" data-sport="judo" aria-label="Judo">
      <div class="sport-visual">🥋</div><h2>Judo</h2>
    </button>
    <button class="sport-card" data-sport="atletiek" aria-label="Atletiek">
      <div class="sport-visual">🏃</div><h2>Atletiek</h2>
    </button>
    <button class="sport-card" data-sport="dans" aria-label="Dans">
      <div class="sport-visual">💃</div><h2>Dans</h2>
    </button>
  </main>

  <footer class="site-footer">
    <p>© 2025 FitPlanner</p>
  </footer>
</body>
</html>
